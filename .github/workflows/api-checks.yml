name: API syntax checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check server/index.js
          node --check server/db.js
          node --check server/middleware/require-auth.js
          node --check server/routes/auth.js
          node --check server/routes/cards.js
          node --check server/routes/vouchers.js
          node --check scripts/migrate.js
          node --check scripts/create-user.js
